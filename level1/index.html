<!DOCTYPE html>
<html>
<head>
<title>Escape The World – Level 1</title>
<style>
body {
  margin: 0;
  background: #050505;
  overflow: hidden;
  font-family: monospace;
  color: white;
}
canvas {
  display: block;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="550"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ================= LOCKS ================= */
let dead = false;
let won = false;

/* ================= INPUT ================= */
const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let mouse = { x: 0, y: 0, down: false };
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener("mousedown", () => mouse.down = true);
canvas.addEventListener("mouseup", () => mouse.down = false);

/* ================= GAME STATE ================= */
let gameTimer = 0;

/* ================= PLAYER ================= */
const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  r: 12,
  speed: 3,
  angle: 0
};

/* ================= ENTITIES ================= */
const bullets = [];
const enemies = [];

const keyItem = {
  x: canvas.width / 2,
  y: 80,
  active: false,
  collected: false
};

const exitDoor = {
  x: canvas.width - 80,
  y: canvas.height / 2,
  open: false
};

/* ================= HELPERS ================= */
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

/* ================= ENEMIES ================= */
function spawnEnemy() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = 0; y = Math.random() * canvas.height; }
  if (edge === 1) { x = canvas.width; y = Math.random() * canvas.height; }
  if (edge === 2) { x = Math.random() * canvas.width; y = 0; }
  if (edge === 3) { x = Math.random() * canvas.width; y = canvas.height; }

  const carriesKey =
    !keyItem.active &&
    !keyItem.collected &&
    gameTimer >= 20 &&
    !enemies.some(e => e.carriesKey);

  enemies.push({ x, y, r: 12, speed: carriesKey ? 2.5 : 2.0, carriesKey });
}

/* ================= UPDATE ================= */
let lastTime = performance.now();
let spawnTimer = 0;

function update(now) {
  if (dead || won) return;

  const dt = (now - lastTime) / 1000;
  lastTime = now;

  gameTimer += dt;
  spawnTimer += dt;

  if (spawnTimer > 1.2) {
    spawnEnemy();
    spawnTimer = 0;
  }

  let dx = 0, dy = 0;
  if (keys["w"]) dy--;
  if (keys["s"]) dy++;
  if (keys["a"]) dx--;
  if (keys["d"]) dx++;

  const len = Math.hypot(dx, dy);
  if (len) {
    dx /= len; dy /= len;
    player.x += dx * player.speed;
    player.y += dy * player.speed;
  }

  player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
  player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  if (mouse.down) {
    bullets.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(player.angle) * 6,
      vy: Math.sin(player.angle) * 6,
      life: 60
    });
    mouse.down = false;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x += bullets[i].vx;
    bullets[i].y += bullets[i].vy;
    if (--bullets[i].life <= 0) bullets.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(a) * e.speed;
    e.y += Math.sin(a) * e.speed;

    if (dist(e, player) < e.r + player.r && !dead) {
      dead = true;
      parent.postMessage({ type: "DEATH" }, "*");
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (dist(e, bullets[j]) < e.r) {
        if (e.carriesKey) {
          keyItem.active = true;
          keyItem.x = e.x;
          keyItem.y = e.y;
        }
        enemies.splice(i, 1);
        bullets.splice(j, 1);
        break;
      }
    }
  }

  if (keyItem.active && !keyItem.collected && dist(player, keyItem) < 20) {
    keyItem.collected = true;
    exitDoor.open = true;
  }

  if (exitDoor.open && dist(player, exitDoor) < 30 && !won) {
    won = true;
    parent.postMessage({ type: "WIN" }, "*");
  }
}

/* ================= DRAW ================= */
function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "cyan";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "white";
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.lineTo(
    player.x + Math.cos(player.angle) * 20,
    player.y + Math.sin(player.angle) * 20
  );
  ctx.stroke();

  ctx.fillStyle = "yellow";
  bullets.forEach(b => ctx.fillRect(b.x - 2, b.y - 2, 4, 4));

  ctx.fillStyle = "red";
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
  });

  if (keyItem.active && !keyItem.collected) {
    ctx.fillStyle = "gold";
    ctx.fillRect(keyItem.x - 8, keyItem.y - 8, 16, 16);
  }

  ctx.fillStyle = exitDoor.open ? "lime" : "darkred";
  ctx.fillRect(exitDoor.x - 20, exitDoor.y - 40, 40, 80);
}

/* ================= LOOP ================= */
function loop(now) {
  update(now);
  draw();
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>

</body>
</html>
